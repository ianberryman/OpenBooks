name: 🐞 Bug report
description: Something behaves incorrectly. For ledger bugs, include the postings.
labels: ['type:bug', 'status:triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not report security vulnerabilities here** — see
        [SECURITY.md](https://github.com/OpenBooksAccounting/OpenBooks/blob/develop/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The symptom, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: postings
    attributes:
      label: Postings involved (ledger bugs)
      description: >
        For anything touching the ledger, include the journal lines. A symptom without the postings
        is rarely enough to reproduce an accounting bug.
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, how you're running it (Docker image or dev), MySQL version if relevant.
