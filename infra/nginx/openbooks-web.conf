# The web SPA, served same-origin with the API.
#
# The React client calls `/v1` and `/health` as relative paths, the session is an
# HttpOnly SameSite=Lax cookie, and the API ships no CORS layer — so the app and
# the API must share an origin. This server serves the built SPA and reverse-
# proxies the API surface to the `api` container, which is exactly what Vite's dev
# proxy does at :5173. `/docs` is proxied too so the Swagger UI is reachable from
# the same origin.
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Resolved per request (via the variable upstream below)
    # rather than once at startup, so nginx does not cache a stale `api` IP after
    # the update workflow (`docker compose build && up -d`) recreates that container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Real files (the hashed /assets/* bundles) are served directly; every other
    # path falls back to index.html so client-side routes deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        set $api http://api:3000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $api http://api:3000;
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
    }

    # The OAuth 2.1 flow (authorize/consent/token/revoke) and the MCP tool host (M5),
    # both served outside `/v1` — the consent screen posts a native form the browser
    # follows a 302 out of, so it must reach the API, not the SPA fallback. Same headers
    # as `/v1/` because these carry the session cookie and issue redirects.
    location /oauth/ {
        set $api http://api:3000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The unauthenticated hosted artifacts served outside `/v1` (OB-121/D-74, OB-220):
    # `/public/invoices/{token}/pdf` and `/public/statements/{token}/pdf`, the PDF links
    # in a delivery email. Like `/oauth/`, these carry no session and must reach the API,
    # not the SPA fallback — a `try_files` miss would answer index.html with a 200 and
    # hand a customer HTML where a PDF was promised. The dev proxy (`vite.config.ts`) has
    # always routed `/public` here; this is the prod half of the same rule.
    location /public/ {
        set $api http://api:3000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The local StorageProvider's retrieval path (`local.ts#signedUrl` → `/artifacts/<key>`,
    # LOCAL_ARTIFACT_PREFIX): the self-host analog of an s3 presigned URL, streamed by the api's
    # `GET /artifacts/*` (routes/artifacts.ts). It carries no session — the unguessable key is the
    # capability — and must reach the api, not the SPA fallback. A `try_files` miss would answer
    # index.html with a 200, so every local-storage download link (1099 Copy B, statement packages,
    # customer statements) would deep-link into the SPA and render the default route instead of the
    # PDF. The dev proxy (`vite.config.ts`) has always routed `/artifacts` here; this is the prod half.
    location /artifacts/ {
        set $api http://api:3000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        set $api http://api:3000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        set $api http://api:3000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
