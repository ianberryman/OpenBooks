yarnPath: .yarn/releases/yarn-4.17.1.cjs

# node-modules rather than PnP. PnP's strict resolution is attractive, but this
# project depends on argon2 (native), esbuild (platform binaries), and
# testcontainers (spawns Docker), all of which are lower-friction under a real
# node_modules tree. Reversible: switch to `pnp` and unplug the natives if the
# phantom-dependency guarantees become worth the setup cost.
nodeLinker: node-modules

enableGlobalCache: true
compressionLevel: mixed

# Yarn 4's hardened default, made explicit. No dependency here needs a build
# script: argon2 and esbuild both resolve platform prebuilds at require time,
# verified for darwin-arm64 and the linux targets the image builds for. If a
# dependency ever genuinely needs one, allow it for that package alone via
# `dependenciesMeta.<pkg>.built: true` — never by flipping this global.
enableScripts: false
